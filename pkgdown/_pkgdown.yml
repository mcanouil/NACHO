url: https://m.canouil.dev/NACHO/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # bslib resolves the brand path from the working directory: build the site from the package root, as CI does.
    brand: pkgdown/_brand.yml
    navbar-bg: "#182430"
    # pkgdown default of 56px plus the 4px strip in extra.scss.
    pkgdown-nav-height: 60px
    navbar-light-color: "#FFFFFF"
    navbar-light-hover-color: "#FCB448"
    navbar-light-active-color: "#FCB448"
    navbar-dark-color: "#FFFFFF"
    navbar-dark-hover-color: "#FCB448"
    navbar-dark-active-color: "#FCB448"
    base_font:
      google:
        family: Source Sans 3
        wght: [400, 700]
        ital: [0, 1]
    heading_font:
      google:
        family: Source Sans 3
        wght: [400, 700]
        ital: [0, 1]
    code_font:
      google:
        family: JetBrains Mono
        wght: [400, 700]

development:
  mode: auto
  version_label: white

articles:
  - title: Guides
    navbar: Articles
    contents:
      - articles/nacho-app
      - NACHO-analysis

authors:
  Mickaël Canouil:
    href: https://mickael.canouil.fr

reference:
  - title: Load and normalise
    desc: Read RCC files, compute quality-control metrics and normalise counts.
    contents:
      - load_rcc
      - read_nacho
      - upgrade_nacho
      - as_summarized_experiment
      - nacho_thresholds
      - normalise
      - exclude_outliers
      - housekeeping_stability
      - suggest_ruv_k
      - batch_diagnostics
  - title: Visualise and report
    desc: Explore quality control interactively, plot a single metric, or write a full report.
    contents:
      - visualise
      - autoplot.nacho
      - nacho-methods
      - nacho-accessors
      - filter_detected
      - render
  - title: Shiny application
    contents:
      - nacho_app
      - deploy
  - title: Data
    contents:
      - GSE74821
