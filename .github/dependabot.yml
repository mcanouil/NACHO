version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "cron"
      cronjob: "00 12 1 * *"
    labels:
      - "Type: Dependencies :arrow_up:"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
