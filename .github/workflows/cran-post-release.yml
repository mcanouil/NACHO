name: CRAN post-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cran-post-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # The App token pushes the development branch, so the required checks of
      # its pull request run; the default token would start none.
      - name: Get the App token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Check that CRAN serves the submitted version
        id: accepted
        run: .github/scripts/cran-accepted.sh CRAN-SUBMISSION >> "${GITHUB_OUTPUT}"

      - name: Name the development branch
        id: branch
        env:
          VERSION: ${{ steps.accepted.outputs.version }}
        run: echo "branch=ci/dev-version-${VERSION//./-}" >> "${GITHUB_OUTPUT}"

      # The notes come from NEWS.md as CRAN got it, not as main holds it now.
      - name: Read NEWS.md at the submitted commit
        env:
          SHA: ${{ steps.accepted.outputs.sha }}
        run: git show "${SHA}:NEWS.md" > "${RUNNER_TEMP}/NEWS-submitted.md"

      - name: Extract the release notes
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          ecosystems: r
          version: ${{ steps.accepted.outputs.version }}
          changelog: ${{ runner.temp }}/NEWS-submitted.md
          section-heading: ""

      # A rerun keeps a published release whose tag is on the submitted commit,
      # and goes on to the development version.
      - name: Create the tag and the GitHub release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.accepted.outputs.version }}
          tag-prefix: v
          title: NACHO {version}
          target: ${{ steps.accepted.outputs.sha }}
          body-file: ${{ steps.notes.outputs.body-file }}
          existing: keep
          token: ${{ steps.token.outputs.token }}

      - name: Start the next development version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: dev
          ecosystems: r
          tag-prefix: v
          token: ${{ steps.token.outputs.token }}

      # A plain rm keeps the file in the index, so land sees its deletion.
      - name: Remove CRAN-SUBMISSION
        run: rm CRAN-SUBMISSION

      - name: Open the development version pull request
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          message: "chore: start development after NACHO ${{ steps.accepted.outputs.version }}"
          branch: ${{ steps.branch.outputs.branch }}
          body: "NACHO ${{ steps.accepted.outputs.version }} is on CRAN and tagged as v${{ steps.accepted.outputs.version }}. This moves main to the next development version and removes CRAN-SUBMISSION."
          files: |
            ${{ steps.bump.outputs.files }}
            CRAN-SUBMISSION
          merge: auto
          wait: false
          allow-unchanged: true
          token: ${{ steps.token.outputs.token }}

      - name: Summary
        env:
          VERSION: ${{ steps.accepted.outputs.version }}
          PR_URL: ${{ steps.land.outputs.pull-request }}
        run: |
          {
            echo "## NACHO ${VERSION} released"
            echo ""
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
            echo "- Development version pull request: ${PR_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
