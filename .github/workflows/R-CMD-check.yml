# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/nacho-3]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ${{ matrix.config.os }}
    # The ruleset on main requires "R CMD check ubuntu-latest (release)" and
    # "R CMD check ubuntu-latest (devel)", so this name must not change.
    name: R CMD check ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NACHO_REQUIRE_QUARTO: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # pak builds R-devel dependencies from source; four parallel
          # workers keep a cold-cache build within the job timeout.
          Ncpus: 4

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          # The default saves the cache only when the job succeeds.
          # R-devel builds every package from source, so a devel job that
          # fails or is cancelled after this step would otherwise start
          # cold every time.
          cache: always
          # A new version invalidates the cache of every matrix job.
          # Version 2 drops the devel cache built with R_KEEP_PKG_SOURCE.
          cache-version: 2

      - name: Install HTML Tidy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      # Keep source references for NACHO only. On R-devel, dependencies build
      # from source, and S7 then keeps lazy-loaded source references. Those
      # end up in NACHO's lazy-load database with the path of the temporary
      # library that R CMD check deletes, so the tests fail to read S7.rdb.
      - uses: r-lib/actions/check-r-package@v2
        env:
          R_KEEP_PKG_SOURCE: yes
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Check the tarball stays under 5 MB
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          set -euo pipefail
          tarball=$(find check -maxdepth 1 -name 'NACHO_*.tar.gz' -print -quit)
          if [ -z "$tarball" ]; then
            echo "::error::No NACHO tarball in check/; the check-r-package step must have changed where it builds."
            exit 1
          fi
          size=$(stat -c %s "$tarball")
          echo "Tarball size: ${size} bytes"
          if [ "$size" -ge 5000000 ]; then
            echo "::error::${tarball} is ${size} bytes, over the 5 MB CRAN guidance."
            exit 1
          fi

  test-coverage:
    needs: r-cmd-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          # Pull requests from forks get no OIDC token, so they upload without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          fail_ci_if_error: ${{ !github.event.pull_request.head.repo.fork }}

      # covr reports only that the tests failed; the details are in testthat.Rout.fail.
      - name: Show testthat output
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/package" ]; then
            echo "::warning::covr did not install the package, so no tests ran."
            exit 0
          fi
          files=$(find "$RUNNER_TEMP/package" -type f -name 'testthat.Rout*')
          if [ -z "$files" ]; then
            echo "::warning::No testthat.Rout* file under $RUNNER_TEMP/package; check the covr install_path."
            exit 0
          fi
          while IFS= read -r file; do
            echo "::group::$file"
            cat "$file" || echo "::warning::Could not read $file."
            echo "::endgroup::"
          done <<< "$files"
        shell: bash

  format:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check
