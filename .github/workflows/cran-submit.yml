name: CRAN submission

on:
  push:
    branches:
      - main
    paths:
      - DESCRIPTION
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: "Build and check, but stop before uploading to CRAN"
        default: true

permissions:
  contents: read

concurrency:
  group: cran-submission
  cancel-in-progress: false

jobs:
  guard:
    name: Decide whether to submit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      submit: ${{ steps.guard.outputs.submit }}
      version: ${{ steps.guard.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the release guard
        id: guard
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          .github/scripts/release-guard.sh . > "${RUNNER_TEMP}/guard.txt"
          if [ "${DRY_RUN}" = "true" ]; then
            sed -i -e 's/^submit=.*/submit=true/' \
              -e 's/^reason=.*/reason=dry run: build, check and stop before uploading/' \
              "${RUNNER_TEMP}/guard.txt"
          fi
          tee -a "${GITHUB_OUTPUT}" < "${RUNNER_TEMP}/guard.txt"
          {
            echo "## CRAN submission guard"
            echo ""
            sed 's/^/- /' "${RUNNER_TEMP}/guard.txt"
          } >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: Build and check the tarball
    needs: guard
    if: ${{ needs.guard.outputs.submit == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Set up TinyTeX for the PDF manual
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgbuild
          needs: check

      - name: Install HTML Tidy
        run: sudo apt-get install -y tidy

      - name: Build the tarball with the manual
        id: build
        run: |
          mkdir -p cran
          Rscript -e 'path <- pkgbuild::build(".", dest_path = "cran", manual = TRUE); cat("tarball=", path, "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)'

      - name: Run R CMD check --as-cran
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(Sys.getenv("TARBALL"), args = "--as-cran", error_on = "warning", check_dir = "check")'

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cran-tarball
          path: cran/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  submit:
    name: Submit to CRAN
    needs: [guard, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cran
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      SUBMITTED_SHA: ${{ github.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Checkout the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Git user
        uses: ./.github/actions/setup-git-user
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Install the upload tools
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::devtools
            any::httr2

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cran-tarball
          path: cran

      - name: Check that main has no submission of this version
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git fetch -q --tags origin main
          .github/scripts/release-guard.sh . > "${RUNNER_TEMP}/guard.txt"
          if ! grep -qx 'submit=true' "${RUNNER_TEMP}/guard.txt"; then
            echo "::error::$(sed -n 's/^reason=//p' "${RUNNER_TEMP}/guard.txt"). Nothing was uploaded."
            exit 1
          fi

      - name: Upload to CRAN
        run: |
          args=("cran/NACHO_${VERSION}.tar.gz")
          if [ "${DRY_RUN}" != "true" ]; then
            args+=("--submit")
          fi
          Rscript .github/scripts/cran-upload.R "${args[@]}"

      - name: Record the submission on main
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git fetch origin main
          git switch -C record-cran-submission origin/main
          git add CRAN-SUBMISSION
          git commit -m "chore: record CRAN submission of NACHO ${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "## CRAN submission of NACHO ${VERSION}"
            echo ""
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- Dry run: nothing was uploaded."
            else
              echo "- Uploaded. Confirm the submission from the email CRAN sends to the maintainer."
              echo "- Once CRAN accepts it, run the CRAN post-release workflow."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
