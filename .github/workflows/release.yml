name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version bump"
        default: "patch"
        options:
          - "patch"
          - "minor"
          - "major"
      auto_merge:
        type: boolean
        description: "Merge the bump pull request straight away (untick to edit cran-comments.md first)"
        default: true
      rhub:
        type: boolean
        description: "Also run the R-hub checks and list them in cran-comments.md"
        default: false

permissions:
  contents: read

# Serialise releases so that two runs never bump the same version at once,
# and never cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    env:
      AUTO_MERGE: ${{ inputs.auto_merge }}
      RHUB: ${{ inputs.rhub }}

    steps:
      # The App token pushes the bump branch, so the required checks of its
      # pull request run; the default token would start none.
      - name: Get the App token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install release tools
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            deps::.
            any::cffr
            any::spelling
            any::urlchecker
            any::GEOquery
            any::Biobase

      - name: Rebuild the GSE74821 example object
        run: Rscript data-raw/GSE74821.R

      # The r preset stops when NEWS.md has no development heading, and drops
      # the .9000 part of the version.
      - name: Bump version and prepare release files
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          ecosystems: r, citation
          tag-prefix: v
          token: ${{ steps.token.outputs.token }}
          after-bump: |
            sed "s/@VERSION@/${VERSION}/g" .github/templates/cran-comments.md > cran-comments.md
            if [ "${RHUB}" != "true" ]; then
              sed -i '/^- R-hub:/d' cran-comments.md
            fi

      - name: Name the bump branch
        id: branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: echo "branch=ci/release-${VERSION//./-}" >> "${GITHUB_OUTPUT}"

      - name: Validate CITATION.cff
        run: Rscript -e 'if (!isTRUE(cffr::cff_validate("CITATION.cff"))) quit(status = 1L)'

      - name: Check spelling
        run: |
          Rscript -e 'res <- spelling::spell_check_package(); if (nrow(res) > 0L) { print(res); quit(status = 1L) }'

      - name: Check URLs
        run: Rscript -e 'stopifnot(packageVersion("urlchecker") >= "2.0.0"); urlchecker::url_check()'

      - name: Commit and open the bump pull request
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v
          message: "chore: release NACHO ${{ steps.bump.outputs.version }}"
          branch: ${{ steps.branch.outputs.branch }}
          body: |
            This bumps NACHO to ${{ steps.bump.outputs.version }} and refreshes `CITATION.cff` and `cran-comments.md`.

            Once it merges, the CRAN submission workflow builds and checks the tarball, then waits for approval on the `cran` environment before uploading.
          files: |
            ${{ steps.bump.outputs.files }}
            cran-comments.md
            data/GSE74821.rda
          merge: ${{ inputs.auto_merge && 'auto' || 'none' }}
          wait: false
          assignees: ${{ !inputs.auto_merge && github.actor || '' }}
          token: ${{ steps.token.outputs.token }}

      - name: Dispatch R-hub checks
        if: ${{ inputs.rhub }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # Auto-merge waits for the required checks, so main still holds the
          # previous version here; the bump branch has the version to submit.
          gh workflow run rhub.yaml \
            --ref "${BRANCH}" \
            -f config="linux,windows,macos-arm64,nosuggests" \
            -f name="NACHO ${VERSION}"

      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_URL: ${{ steps.land.outputs.pull-request }}
        run: |
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "- Bump pull request: ${PR_URL}"
            echo "- Auto-merge: ${AUTO_MERGE}"
            echo "- R-hub: ${RHUB}"
            echo "- Next: the CRAN submission workflow starts when the pull request merges."
          } >> "${GITHUB_STEP_SUMMARY}"
